name: Resolve database checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pinned dependencies (including Supabase CLI 2.117.0)
        run: npm ci

      - name: Start local Auth, API and database
        run: npx supabase start -x studio,realtime,imgproxy,logflare,vector,supavisor

      - name: Lint database
        run: npx supabase db lint --level warning

      - name: Run pgTAP database tests
        run: npx supabase test db

      - name: Serve authenticated image endpoint
        run: npx supabase functions serve ticket-image > /tmp/resolve-image-function.log 2>&1 &

      - name: Run authenticated role-boundary tests
        run: npm run test:integration

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test live session recovery
        run: npm run test:browser:live
